# Environment for the CrystalFormer and SigmaFormer baselines.
# These wrap a MoLFormer backbone. The published results used the versions
# pinned below; they are older than the environment used for COSMO-3D-Former.
name: cosmo3dformer-molformer
channels: [conda-forge]
dependencies:
  - python=3.8
  - pip
  - pip:
      - torch==1.7.1
      - transformers==4.6.0
      - scikit-learn==0.24.2
      - numpy==1.24.4
      - pandas==1.2.4
      - rdkit
