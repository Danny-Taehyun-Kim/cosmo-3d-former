# Two-stage fine-tuning configuration.
# Values match Supplementary Table 2.
head_hidden: 256
dropout: 0.1

# Stage one: head only, on cached embeddings.
stage1_lr: 0.001
stage1_weight_decay: 0.0001
stage1_epochs: 80
stage1_patience: 10
stage1_batch_size: 256

# Stage two: encoder and head together.
encoder_lr: 0.00003
head_lr: 0.0001
weight_decay: 0.0001
epochs: 300
patience: 40
warmup_epochs: 5
batch_size: 96
grad_clip: 1.0
head_seed: 0
precision: bfloat16
