# Pre-training configuration for the M encoder.
# Values match Supplementary Table 2.
d_model: 480
n_heads: 8
layers: 8
ff_mult: 4
dropout: 0.1
decoder_width: 128
decoder_layers: 2
decoder_heads: 4
rbf_centres: 64
rbf_cutoff: 16.0
encoder_bias_scale: 1.0

lr: 0.0003
epochs: 150
batch_size: 128
weight_decay: 0.05
warmup_fraction: 0.05
grad_clip: 1.0
betas: [0.9, 0.95]
precision: bfloat16

mask_ratio: 0.9
block_radius: 2.0
aux_weight: 0.5

seed: 1234
val_fraction: 0.02
val_min: 64
val_mask_seed: 777
checkpoint_every: 10
